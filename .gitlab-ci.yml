# OrgX on GitLab.com (Free tier) - SLSA test drive
#
#   L1  : job "build" asks the runner to generate SLSA provenance for its
#         artifacts (RUNNER_GENERATE_ARTIFACTS_METADATA). The file is unsigned.
#   L2? : job "attest" signs that provenance with Sigstore keyless signing
#         (cosign + a GitLab ID token). Whether this satisfies "Provenance is
#         Authentic" is a question for your review: the signing runs in a job
#         the project controls, and the certificate names the pipeline file,
#         not the job (see the manual "rogue-*" jobs).
#   L3  : GitLab's own L3 attestation is an Experiment for Ultimate with a
#         feature flag - record it as out of reach, do not fake it.
#
# Privacy: signing writes the project path to Sigstore's public, permanent
# transparency log. Use an anonymous namespace; never a real organisation name.

stages: [test, build, attest, verify]

variables:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

test:
  stage: test
  image: python:3.12-slim
  script:
    - PYTHONPATH=src python -m unittest discover -s tests -v

build:
  stage: build
  image: python:3.12-slim
  variables:
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"   # L1: runner-generated provenance
  script:
    - bash scripts/build.sh
  artifacts:
    name: orgx-parcel-dist
    paths:
      - dist/
    expire_in: 30 days

attest:
  stage: attest
  image: alpine:3.22
  needs: [build]
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  before_script:
    - apk add --no-cache cosign jq
  script:
    - ls -la . dist
    - META="$(ls ./*-metadata.json 2>/dev/null | head -n1 || true)"
    - |
      if [ -z "$META" ]; then
        echo "Runner provenance (<artifact name>-metadata.json) not found next to the artifacts."
        echo "Record this in RESULTS.md and inspect the build job's artifact archive by hand."
        exit 1
      fi
    - cp "$META" runner-provenance.json
    - jq '{_type, predicateType, subject}' runner-provenance.json
    - jq '.predicate' runner-provenance.json > predicate.json
    - WHEEL="$(ls dist/*.whl)"
    - cosign version
    - cosign attest-blob --predicate predicate.json --type https://slsa.dev/provenance/v1 --bundle provenance.sigstore.json "$WHEEL"
  artifacts:
    paths:
      - dist/
      - runner-provenance.json
      - predicate.json
      - provenance.sigstore.json
    expire_in: 30 days

verify:
  stage: verify
  image: alpine:3.22
  needs: [attest]
  before_script:
    - apk add --no-cache cosign
  script:
    - if [ -n "${CI_COMMIT_TAG:-}" ]; then REF="refs/tags/${CI_COMMIT_TAG}"; else REF="refs/heads/${CI_COMMIT_BRANCH}"; fi
    - WHEEL="$(ls dist/*.whl)"
    - >
      cosign verify-blob-attestation
      --bundle provenance.sigstore.json
      --type https://slsa.dev/provenance/v1
      --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@${REF}"
      --certificate-oidc-issuer "${CI_SERVER_URL}"
      "$WHEEL"

# ---------------------------------------------------------------------------
# LAB ONLY - attack simulation, started by hand: play "rogue-build", then
# "rogue-attest". A job added to the SAME pipeline file builds a backdoored
# wheel and signs the GENUINE predicate over it. Its certificate identity is
# identical to the official one, because GitLab names the pipeline file, not
# the job.
# ---------------------------------------------------------------------------
rogue-build:
  stage: build
  image: python:3.12-slim
  when: manual
  allow_failure: true
  script:
    - python attacks/inject_backdoor.py
    - bash scripts/build.sh
    - mkdir -p rogue && mv dist/*.whl rogue/
  artifacts:
    paths:
      - rogue/
    expire_in: 30 days

rogue-attest:
  stage: verify
  image: alpine:3.22
  needs: [rogue-build, attest]
  when: manual
  allow_failure: true
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  variables:
    COSIGN_YES: "true"
  before_script:
    - apk add --no-cache cosign
  script:
    - WHEEL="$(ls rogue/*.whl)"
    - cosign attest-blob --predicate predicate.json --type https://slsa.dev/provenance/v1 --bundle rogue-provenance.sigstore.json "$WHEEL"
  artifacts:
    paths:
      - rogue/
      - rogue-provenance.sigstore.json
    expire_in: 30 days
